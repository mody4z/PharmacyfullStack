<div class="page-container">
  <div class="header">
    <h2>Clients Management</h2>
    <div class="header-actions">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterClients()" placeholder="Search clients..." class="search-input" />
      <button *ngIf="isLoggedIn" class="btn btn-primary" (click)="openForm()">+ Add Client</button>
      <a routerLink="/dashboard" class="btn btn-secondary"> Back</a>
    </div>
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Address</th>
          <th>Created Date</th>
          <th *ngIf="isLoggedIn">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let client of filteredClients">
          <td>{{ client.name }}</td>
          <td>{{ client.phoneNumber }}</td>
          <td>{{ client.email }}</td>
          <td>{{ client.address }}</td>
          <td>{{ client.createdDate | date }}</td>
          <td *ngIf="isLoggedIn">
            <button class="btn-action btn-edit" (click)="editClient(client)">Edit</button>
            <button class="btn-action btn-delete" (click)="deleteClient(client.id!)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="modal" *ngIf="showForm">
    <div class="modal-content">
      <h3>{{ editingId ? 'Edit Client' : 'Add New Client' }}</h3>
      <form (ngSubmit)="saveClient()">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" [(ngModel)]="newClient.name" name="name" required class="form-control" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone *</label>
            <input type="tel" [(ngModel)]="newClient.phoneNumber" name="phone" required class="form-control" />
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" [(ngModel)]="newClient.email" name="email" required class="form-control" />
          </div>
        </div>
        <div class="form-group">
          <label>Address *</label>
          <textarea [(ngModel)]="newClient.address" name="address" required class="form-control" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" (click)="closeForm()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
